name: GitHub Alpha / Pre-Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Workspace (Rust + Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Check Tauri desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

  create-release:
    name: Create GitHub Alpha Pre-Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.gh_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "OxideVault ${{ github.ref_name }}"
          body_path: .github/RELEASE_NOTES_v0.1.0-alpha.1.md
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          draft: false

  build-cli:
    name: Build vault-cli (${{ matrix.target_name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target_name: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build vault-cli release binary
        run: cargo build --release -p vault-cli

      - name: Package Unix CLI archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release-cli
          TAG="${GITHUB_REF_NAME:-dev}"
          cp target/release/vault-cli release-cli/
          cp README.md LICENSE CHANGELOG.md release-cli/
          ARCHIVE="vault-cli-${TAG}-${{ matrix.target_name }}.tar.gz"
          tar -czf "$ARCHIVE" -C release-cli .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      - name: Package Windows CLI archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-cli | Out-Null
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          Copy-Item target/release/vault-cli.exe release-cli/
          Copy-Item README.md, LICENSE, CHANGELOG.md release-cli/
          $Archive = "vault-cli-$Tag-${{ matrix.target_name }}.zip"
          Compress-Archive -Path release-cli/* -DestinationPath $Archive
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
          "$Hash  $Archive" | Out-File -Encoding utf8 "$Archive.sha256"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-cli-${{ matrix.target_name }}
          path: |
            vault-cli-*.tar.gz*
            vault-cli-*.zip*

  release-desktop:
    name: Build Tauri Desktop (${{ matrix.os }})
    needs: [verify, create-release]
    if: always() && needs.verify.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Dry-run Tauri bundle on manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- ${{ matrix.args }}

  attach-cli-assets:
    name: Attach CLI Assets to GitHub Release
    needs: [create-release, build-cli, release-desktop]
    if: always() && needs.create-release.result == 'success' && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli-artifacts
          merge-multiple: true

      - name: Upload CLI binaries and checksums to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: cli-artifacts/vault-cli-*
