[package]
name = "oxidevault-desktop"
version = "0.1.0"
description = "OxideVault — Native Rust & Tauri v2 Hybrid Knowledge Graph"
authors = ["OxideVault Contributors"]
edition = "2021"

[workspace]

[lib]
name = "oxidevault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
vault-core = { path = "../crates/vault-core" }
